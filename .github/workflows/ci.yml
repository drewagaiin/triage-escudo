name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y shellcheck bats
      - run: shellcheck triage-escudo.sh
      - run: bats tests/test_triage.bats
  powershell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validar sintaxis de PowerShell
        shell: pwsh
        run: |
          $t=$null;$e=$null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/triage-escudo.ps1",[ref]$t,[ref]$e)
          if($e){$e|ForEach-Object{Write-Error $_.Message}; exit 1} else {Write-Output "Sintaxis OK"}
